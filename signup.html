<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — TripWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="p.css">
</head>
<body>

<nav>
  <div class="logo"><a href="p.html">Trip<span>Wise</span></a></div>
  <div class="navLinks">
    <a href="p.html">Home</a>
    <a href="explore.html">Explore</a>
    <span id="authNavSlot" class="authNavSlot"></span>
  </div>
</nav>

<div class="authWrap">
  <div class="authCard">
    <div class="eyebrow">New here?</div>
    <h2>Create your TripWise account</h2>

    <form id="signupForm">
      <label for="signupName">Full Name</label>
      <input type="text" id="signupName" placeholder="Your name" required>

      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>

      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="At least 6 characters" required>

      <div class="authError" id="authError"></div>

      <button type="submit" class="authSubmitBtn">Sign Up</button>
    </form>

    <p class="authSwitch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="p.js"></script>

</body>
</html>
