<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — TripWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="p.css">
</head>
<body>

<nav>
  <div class="logo"><a href="p.html">Trip<span>Wise</span></a></div>
  <div class="navLinks">
    <a href="p.html">Home</a>
    <a href="explore.html">Explore</a>
    <span id="authNavSlot" class="authNavSlot"></span>
  </div>
</nav>

<div class="authWrap">
  <div class="authCard">
    <div class="eyebrow">Welcome back</div>
    <h2>Log in to TripWise</h2>
    <p class="authSub">Access your planned visits and account settings.</p>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Your password" required>

      <div class="authError" id="authError"></div>

      <button type="submit" class="authSubmitBtn">Log In</button>
    </form>

    <p class="authSwitch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script src="p.js"></script>

</body>
</html>
